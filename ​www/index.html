<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tracer GPS</title>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #121212; color: white; text-align: center; }
    .box { background: #1e1e1e; padding: 20px; border-radius: 12px; width: 85%; max-width: 340px; box-sizing: border-box; }
    h1 { margin-top: 0; font-size: 22px; color: #4caf50; }
    input[type="email"] { width: 100%; padding: 10px; margin-bottom: 15px; background: #2a2a2a; color: white; border: 1px solid #444; border-radius: 6px; box-sizing: border-box; text-align: center; font-size: 14px; }
    .status-val { font-weight: bold; margin: 10px 0; font-size: 15px; color: #ffeb3b; }
    .coords { font-family: monospace; font-size: 12px; color: #aaa; margin-bottom: 15px; }
    button { border: none; padding: 12px; font-size: 15px; font-weight: bold; border-radius: 6px; margin: 5px 0; width: 100%; cursor: pointer; color: white; }
    .btn-start { background: #4caf50; }
    .btn-pause { background: #ff9800; }
    .btn-stop { background: #f44336; }
    button:disabled { opacity: 0.3; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Tracer GPS</h1>
    <input type="email" id="userEmail" placeholder="Zadej svůj e-mail" />
    
    <div id="status" class="status-val">Přípraveno</div>
    <div id="coords" class="coords">Lat: - | Lng: -</div>

    <button id="btnStart" class="btn-start" onclick="startTracking()">START</button>
    <button id="btnPause" class="btn-pause" onclick="togglePause()" disabled>PAUZA</button>
    <button id="btnStop" class="btn-stop" onclick="stopTracking()" disabled>KONEC</button>
  </div>

  <script>
    let timer = null;
    let isPaused = false;

    const emailInput = document.getElementById('userEmail');
    emailInput.value = localStorage.getItem('tracer_email') || '';
    emailInput.addEventListener('input', (e) => {
      localStorage.setItem('tracer_email', e.target.value.trim());
    });

    function setUI(status, startBtn, pauseBtn, stopBtn, pauseTxt = "PAUZA") {
      document.getElementById('status').innerText = status;
      document.getElementById('btnStart').disabled = !startBtn;
      document.getElementById('btnPause').disabled = !pauseBtn;
      document.getElementById('btnStop').disabled = !stopBtn;
      document.getElementById('btnPause').innerText = pauseTxt;
    }

    function fetchLocation() {
      if (isPaused) return;

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          document.getElementById('coords').innerText = `Lat: ${lat.toFixed(5)} | Lng: ${lng.toFixed(5)}`;
          
          const email = localStorage.getItem('tracer_email') || emailInput.value.trim();

          fetch("https://7x.wz.cz/tracer/api_location.php", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              email: email,
              lat: lat,
              lng: lng
            })
          }).catch(e => console.error("Chyba sítě:", e));
        },
        (err) => {
          document.getElementById('status').innerText = "GPS chyba: " + err.message;
        },
        { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
      );
    }

    function startTracking() {
      if (!navigator.geolocation) {
        alert("GPS není v tomto zařízení podporována.");
        return;
      }
      stopTracking();
      isPaused = false;
      setUI("Sledování běží...", false, true, true, "PAUZA");
      
      fetchLocation();
      timer = setInterval(fetchLocation, 4000);
    }

    function togglePause() {
      if (isPaused) {
        isPaused = false;
        setUI("Sledování běží...", false, true, true, "PAUZA");
        fetchLocation();
      } else {
        isPaused = true;
        setUI("Pozastaveno", false, true, true, "POKRAČOVAT");
      }
    }

    function stopTracking() {
      if (timer !== null) {
        clearInterval(timer);
        timer = null;
      }
      isPaused = false;
      document.getElementById('coords').innerText = "Lat: - | Lng: -";
      setUI("Zastaveno", true, false, false, "PAUZA");
    }
  </script>
</body>
</html>
