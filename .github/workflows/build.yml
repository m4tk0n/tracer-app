name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Web Dir and Index
        run: |
          mkdir -p www
          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html lang="cs">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Tracer GPS</title>
            <style>
              body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #121212; color: white; text-align: center; }
              .box { background: #1e1e1e; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); width: 85%; max-width: 350px; }
              h1 { margin-top: 0; font-size: 24px; color: #4caf50; }
              .status-val { font-weight: bold; margin: 15px 0; font-size: 16px; color: #ffeb3b; }
              .coords { font-family: monospace; font-size: 13px; color: #aaa; margin-bottom: 20px; word-break: break-all; }
              button { border: none; padding: 14px 20px; font-size: 16px; font-weight: bold; border-radius: 6px; margin: 6px 0; width: 100%; cursor: pointer; }
              .btn-start { background: #4caf50; color: white; }
              .btn-pause { background: #ff9800; color: white; }
              .btn-stop { background: #f44336; color: white; }
              button:disabled { opacity: 0.4; cursor: not-allowed; }
            </style>
          </head>
          <body>
            <div class="box">
              <h1>Tracer GPS</h1>
              <div id="status" class="status-val">Přípraveno</div>
              <div id="coords" class="coords">Lat: - | Lng: -</div>

              <button id="btnStart" class="btn-start" onclick="startTracking()">START</button>
              <button id="btnPause" class="btn-pause" onclick="togglePause()" disabled>PAUZA</button>
              <button id="btnStop" class="btn-stop" onclick="stopTracking()" disabled>KONEC</button>
            </div>

            <script>
              let watchId = null;
              let isPaused = false;

              function updateUI(statusText, startEn, pauseEn, stopEn, pauseLabel = "PAUZA") {
                document.getElementById('status').innerText = statusText;
                document.getElementById('btnStart').disabled = !startEn;
                document.getElementById('btnPause').disabled = !pauseEn;
                document.getElementById('btnStop').disabled = !stopEn;
                document.getElementById('btnPause').innerText = pauseLabel;
              }

              async function startTracking() {
                const BackgroundGeolocation = window.Capacitor?.Plugins?.BackgroundGeolocation;

                if (!BackgroundGeolocation) {
                  alert("Background Geolocation plugin není dostupný.");
                  return;
                }

                isPaused = false;
                updateUI("Sledování běží...", false, true, true, "PAUZA");

                try {
                  watchId = await BackgroundGeolocation.addWatcher(
                    {
                      backgroundMessage: "Tracer zaznamenává polohu na pozadí.",
                      backgroundTitle: "Tracer GPS aktivní",
                      requestPermissions: true,
                      stale: false,
                      distanceFilter: 15 // Změněno na 15 metrů pro lepší výdrž baterie
                    },
                    function (location, error) {
                      if (error) {
                        if (error.code === "NOT_AUTHORIZED") {
                          alert("Povolte aplikaci přístup k poloze 'Vždy' v nastavení telefonu.");
                        }
                        console.error("GPS chyba:", error);
                        return;
                      }

                      if (location && !isPaused) {
                        const lat = location.latitude;
                        const lng = location.longitude;

                        document.getElementById('coords').innerText = `Lat: ${lat.toFixed(5)} | Lng: ${lng.toFixed(5)}`;
                        sendData(lat, lng);
                      }
                    }
                  );
                } catch (err) {
                  console.error("Chyba spuštění pozadí:", err);
                  document.getElementById('status').innerText = "Chyba spuštění";
                }
              }

              function togglePause() {
                if (isPaused) {
                  isPaused = false;
                  updateUI("Sledování běží...", false, true, true, "PAUZA");
                } else {
                  isPaused = true;
                  updateUI("Pozastaveno", false, true, true, "POKRAČOVAT");
                }
              }

              async function stopTracking() {
                const BackgroundGeolocation = window.Capacitor?.Plugins?.BackgroundGeolocation;
                if (watchId !== null && BackgroundGeolocation) {
                  await BackgroundGeolocation.removeWatcher({ id: watchId });
                  watchId = null;
                }
                isPaused = false;
                document.getElementById('coords').innerText = "Lat: - | Lng: -";
                updateUI("Zastaveno", true, false, false, "PAUZA");
              }

              function sendData(lat, lng) {
                const email = localStorage.getItem('tracer_email') || '';
                fetch("https://7x.wz.cz/tracer/api_location.php", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ email: email, lat: lat, lng: lng })
                }).catch(err => console.error("Chyba při odesílání:", err));
              }
            </script>
          </body>
          </html>
          EOF

      - name: Install Dependencies
        run: npm install

      - name: Add Android Platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure Location & Background Permissions
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          PERMISSIONS='<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n<uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />\n<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n<uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />'
          sed -i "/<manifest/a $PERMISSIONS" $MANIFEST_PATH

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tracer-GPS-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
